<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classic Snake</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <div class="status-row">
          <div>
            <p class="label">Score</p>
            <p id="score" class="value">0</p>
          </div>
          <div>
            <p class="label">Best</p>
            <p id="best-score" class="value">0</p>
          </div>
          <div>
            <p class="label">State</p>
            <p id="state" class="value">Ready</p>
          </div>
        </div>

        <div class="actions">
          <button id="pause-button" type="button">Pause</button>
          <button id="restart-button" type="button">Restart</button>
        </div>

        <div class="board-shell">
          <div
            id="board"
            class="board"
            role="grid"
            aria-label="Snake game board"
          ></div>
        </div>

        <p class="help">
          Use arrow keys or WASD to move. Press Space to pause or resume.
        </p>

        <div class="touch-controls" aria-label="On-screen controls">
          <div class="touch-row">
            <button data-direction="up" type="button">Up</button>
          </div>
          <div class="touch-row">
            <button data-direction="left" type="button">Left</button>
            <button data-direction="down" type="button">Down</button>
            <button data-direction="right" type="button">Right</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
